<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Симулятор зарплаты — Точка опоры</title>
<meta name="theme-color" content="#0b0b12" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icon.svg" type="image/svg+xml" />
<style>
  :root{ --bg:#0b0b12; --card:rgba(255,255,255,.06); --stroke:rgba(255,255,255,.12); --text:#f2f2f7; --muted:#a1a1b5; --accent:#7c5cff; --accent-2:#4ad6c8; --err:#ff5c8a; --radius:20px; --ff:'Inter',sans-serif; }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:var(--ff);line-height:1.5;padding-bottom:80px; min-height:100vh;}
  .container{max-width:640px;margin:0 auto;padding:0 20px}
  header{position:sticky;top:0;z-index:50;backdrop-filter:blur(14px);background:rgba(11,11,18,.75);border-bottom:1px solid var(--stroke);padding:0 20px;}
  .nav{display:flex;align-items:center;justify-content:space-between;height:64px;max-width:1100px;margin:0 auto;}
  .logo{display:flex;align-items:center;gap:10px;font-weight:800;text-decoration:none;color:inherit;}
  .logo-mark{width:32px;height:32px;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--accent-2));}
  .back-btn{font-size:14px;color:var(--muted);text-decoration:none;}
  .page-head{padding:40px 0 20px;text-align:center}
  .page-head h1{font-size:28px;font-weight:800;margin-bottom:12px}
  .page-head p{color:var(--muted);font-size:15px}

  .bank-balance { background: linear-gradient(135deg, rgba(74,214,200,0.15), rgba(124,92,255,0.15)); border: 1px solid var(--accent-2); border-radius: 24px; padding: 24px; text-align: center; margin-bottom: 30px;}
  .bank-balance .lbl { font-size: 14px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); margin-bottom: 8px;}
  .bank-balance .val { font-size: 42px; font-weight: 800; color: var(--text); line-height: 1; letter-spacing: -1px;}
  .bank-balance .sub { font-size: 13px; color: var(--accent-2); margin-top: 8px; font-weight: 600;}

  .expense-list { display: flex; flex-direction: column; gap: 16px; margin-bottom: 30px;}
  .expense-item { background: var(--card); border: 1px solid var(--stroke); border-radius: 16px; padding: 16px; }
  .expense-item .head { display: flex; justify-content: space-between; margin-bottom: 12px; font-size: 15px; font-weight: 600;}
  .expense-item .head span:last-child { color: var(--text); font-weight: 800;}
  .expense-item input[type="range"] { width: 100%; accent-color: var(--accent); }

  .result-box { background: rgba(255,255,255,0.03); border: 1px dashed var(--stroke); border-radius: 16px; padding: 20px; text-align: center; font-size: 15px;}
  .result-box.success { border-color: var(--accent-2); background: rgba(74,214,200,0.05); color: var(--accent-2);}
  .result-box.danger { border-color: var(--err); background: rgba(255,92,138,0.05); color: var(--err);}
</style>
</head>
<body>

<header>
  <div class="nav">
    <a class="logo" href="index.html"><div class="logo-mark"></div>Точка опоры</a>
    <a href="module-fin.html" class="back-btn">✕ Выйти</a>
  </div>
</header>

<main class="container">
  <div class="page-head">
    <h1>💸 Симулятор зарплаты</h1>
    <p>Представь, что тебе пришла первая зарплата — 35 000 ₽. Как ты её распределишь?</p>
  </div>

  <div class="bank-balance">
    <div class="lbl">Остаток на карте</div>
    <div class="val" id="balanceVal">35 000 ₽</div>
    <div class="sub" id="balanceSub">Пока всё на месте</div>
  </div>

  <div class="expense-list" id="expenseList">
    <!-- Генерируется в JS -->
  </div>

  <div class="result-box" id="resultBox">Двигай ползунки, чтобы распределить бюджет.</div>
</main>

<script>
const START_MONEY = 35000;
const expenses = [
  { id: 'rent', name: '🏠 Жильё (аренда/общага)', max: 15000, val: 0 },
  { id: 'food', name: '🍔 Еда (продукты и кафе)', max: 15000, val: 0 },
  { id: 'transport', name: '🚌 Транспорт', max: 3000, val: 0 },
  { id: 'fun', name: '🎮 Развлечения и шопинг', max: 10000, val: 0 },
  { id: 'savings', name: '🏦 Накопления (в копилку)', max: 10000, val: 0 }
];

const Store = {
  KEY: 'tochka_opory_v1', data: {},
  load(){ try { const raw = localStorage.getItem(this.KEY); this.data = raw ? JSON.parse(raw) : {}; } catch(e){ this.data = {}; } return this.data; },
  save(){ try { localStorage.setItem(this.KEY, JSON.stringify(this.data)); } catch(e){} },
  addXP(n){ this.data.xp = (this.data.xp || 0) + n; this.save(); }
};

Store.load();

function renderExpenses() {
  const list = document.getElementById('expenseList');
  list.innerHTML = expenses.map(e => `
    <div class="expense-item">
      <div class="head"><span>${e.name}</span> <span id="val-${e.id}">0 ₽</span></div>
      <input type="range" min="0" max="${e.max}" step="500" value="${e.val}" 
             oninput="updateExpense('${e.id}', this.value)">
    </div>
  `).join('');
}

function updateExpense(id, value) {
  const e = expenses.find(x => x.id === id);
  e.val = parseInt(value);
  document.getElementById('val-' + id).textContent = e.val.toLocaleString('ru-RU') + ' ₽';
  calculate();
}

function calculate() {
  const totalSpent = expenses.reduce((sum, e) => sum + e.val, 0);
  const balance = START_MONEY - totalSpent;

  const valEl = document.getElementById('balanceVal');
  const subEl = document.getElementById('balanceSub');
  const resBox = document.getElementById('resultBox');

  valEl.textContent = balance.toLocaleString('ru-RU') + ' ₽';
  resBox.className = 'result-box';

  if (balance < 0) {
    valEl.style.color = 'var(--err)';
    subEl.textContent = 'Ты ушел в минус!';
    subEl.style.color = 'var(--err)';
    resBox.textContent = '⚠️ Ой! Ты потратил больше, чем заработал. Придется занимать или урезать расходы.';
    resBox.classList.add('danger');
  } else if (balance === 0) {
    valEl.style.color = 'var(--text)';
    subEl.textContent = 'Впритык до зарплаты';
    subEl.style.color = 'var(--muted)';
    resBox.textContent = 'Ты потратил всё. Это рискованно — любая непредвиденная трата оставит тебя без денег.';
  } else {
    valEl.style.color = 'var(--accent-2)';
    subEl.textContent = 'Можно отложить!';
    subEl.style.color = 'var(--accent-2)';
    resBox.textContent = `Отличная работа! У тебя осталось ${balance.toLocaleString('ru-RU')} ₽. Это твоя подушка безопасности.`;
    resBox.classList.add('success');
    
    // Начисляем XP за хороший результат
    if (!Store.data.salarySimUsed && expenses.find(e => e.id === 'savings').val > 0) {
      Store.data.salarySimUsed = true;
      Store.addXP(15);
      Store.save();
    }
  }
}

renderExpenses();
calculate();
</script>
<script src="ui-upgrade.js"></script>
<script src="bottom-menu.js"></script>
</body>
</html>
